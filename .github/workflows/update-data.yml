name: Actualización diaria de datos GDELT

# Sustituye a la antigua Netlify Scheduled Function (retirada junto con
# netlify/functions y Netlify Blobs). Corre en los servidores de
# GitHub, una vez al día, sin depender de ningún ordenador encendido:
# ejecuta scripts/update-data.mjs, que llama a GDELT server-side y
# reescribe el bloque de datos embebido en index.html, y comitea el
# resultado si ha cambiado.

on:
  schedule:
    - cron: '0 6 * * *' # cada día a las 06:00 UTC
    # Segundo intento diario: GDELT limita/corta a menudo las IPs de los
    # runners (429 / Connect Timeout). Si el primero ya funcionó, este solo
    # refresca los últimos días (el script es append-only e idempotente).
    - cron: '0 15 * * *'
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña "Actions"

permissions:
  contents: write

# Evita dos ejecuciones simultáneas escribiendo index.html a la vez.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sale con código 1 (run en rojo) si la validación falla, si los datos
      # llevan más de 48 h sin refrescarse o si GDELT responde sin días
      # recientes. Los fallos puntuales de GDELT solo dejan un aviso amarillo.
      - name: Ejecutar scripts/update-data.mjs
        id: update
        run: node scripts/update-data.mjs

      # always(): aunque el paso anterior falle, se comitea stale:true y
      # lastError para que el sitio lo refleje. El run sigue saliendo en rojo.
      - name: Commit y push si index.html ha cambiado
        if: always() && steps.update.outcome != 'skipped'
        run: |
          if git diff --quiet -- index.html; then
            echo "Sin cambios en index.html — nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore(data): actualización diaria GDELT $(date -u +'%Y-%m-%d')"
          git push

name: Probar consultas GDELT

# Solo manual (pestaña Actions → "Probar consultas GDELT" → Run workflow).
# Comprueba las consultas de series.config.json sin tocar data/: si GDELT
# las acepta, qué % del volumen se lleva cada grupo y titulares de ejemplo.
# El resultado aparece en el resumen del run.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Días hacia atrás a analizar"
        default: "14"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probar consultas
        run: node scripts/probe-queries.mjs "${{ github.event.inputs.days }}"

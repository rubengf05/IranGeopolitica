name: Actualización diaria de datos GDELT

# Corre en los servidores de GitHub dos veces al día: ejecuta
# scripts/update-data.mjs, que descarga de GDELT las series definidas en
# series.config.json, actualiza data/ (JSON por serie + bundle.js) y
# comitea el resultado si ha cambiado. index.html no se toca.

on:
  schedule:
    - cron: '0 6 * * *' # cada día a las 06:00 UTC
    # Segundo intento diario: GDELT limita/corta a menudo las IPs de los
    # runners (429 / Connect Timeout). Si el primero ya funcionó, este solo
    # refresca los últimos días (el script es append-only e idempotente).
    - cron: '0 15 * * *'
  workflow_dispatch: {} # permite lanzarlo a mano desde la pestaña "Actions"

permissions:
  contents: write

# Evita dos ejecuciones simultáneas escribiendo index.html a la vez.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 6 peticiones espaciadas + reintentos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sale con código 1 (run en rojo) si alguna serie no valida, si lleva
      # más de 48 h sin refrescarse, si GDELT rechaza una consulta o no trae
      # días recientes. Los fallos puntuales solo dejan un aviso amarillo.
      - name: Ejecutar scripts/update-data.mjs
        id: update
        run: node scripts/update-data.mjs

      # always(): aunque el paso anterior falle, se comitea stale:true y
      # lastError para que el sitio lo refleje. El run sigue saliendo en rojo.
      - name: Commit y push si data/ ha cambiado
        if: always() && steps.update.outcome != 'skipped'
        run: |
          git add -A data
          if git diff --cached --quiet; then
            echo "Sin cambios en data/ — nada que commitear."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): actualización diaria GDELT $(date -u +'%Y-%m-%d')"
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push
